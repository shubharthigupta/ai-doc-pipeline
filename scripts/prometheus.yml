global:
  scrape_interval: 15s   # collect metrics every 15 seconds

scrape_configs:
  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['host.docker.internal:8081']  # host.docker.internal = your Windows machine
    metrics_path: '/actuator/prometheus'         # Spring Boot exposes metrics here

  - job_name: 'extraction-service'
    static_configs:
      - targets: ['host.docker.internal:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'embedding-service'
    static_configs:
      - targets: ['host.docker.internal:8083']
    metrics_path: '/actuator/prometheus'

  - job_name: 'query-service'
    static_configs:
      - targets: ['host.docker.internal:8084']
    metrics_path: '/actuator/prometheus'