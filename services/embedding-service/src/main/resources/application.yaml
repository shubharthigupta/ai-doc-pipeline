spring:
  application:
    name: embedding-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/docpipeline
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: embedding-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.aidocpipeline.*"
        spring.json.value.default.type: com.aidocpipeline.embeddingservice.event.DocumentExtractedEvent
        spring.json.use.type.headers: false

server:
  port: 8083

aws:
  region: us-east-1
  bedrock:
    mock-enabled: true

kafka:
  topics:
    document-extracted: document.extracted

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 0.0